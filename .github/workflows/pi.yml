name: PR Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Checkout Toolshop application
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Toolshop Docker environment
        working-directory: toolshop-app
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: docker compose -f docker-compose.prod.yml up --pull missing -d

      - name: Wait for database and initialize Toolshop
        working-directory: toolshop-app
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        shell: bash
        run: |
          set -e
          for attempt in {1..12}; do
            if docker compose -f docker-compose.prod.yml exec -T laravel-api \
              php artisan migrate:fresh --seed; then
              exit 0
            fi
            echo "Waiting for database (attempt $attempt/12)"
            sleep 10
          done
          echo "Toolshop database initialization failed."
          docker compose -f docker-compose.prod.yml logs --tail=100
          exit 1

      - name: Wait for Toolshop API and UI
        shell: bash
        run: |
          set -e
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8091/status -o /dev/null \
              && curl -fsS http://localhost:4200/ -o /dev/null; then
              echo "Toolshop API and UI are ready."
              exit 0
            fi
            echo "Waiting for Toolshop (attempt $attempt/60)"
            sleep 5
          done
          echo "Toolshop did not become ready."
          docker compose -f toolshop-app/docker-compose.prod.yml logs --tail=100
          exit 1

      - name: Run Smoke Tests
        run: npx playwright test --config=config/playwright.config.ts
        env:
          OPENCART_BASE_URL: https://naveenautomationlabs.com/
          DUMMYJSON_BASE_URL: https://dummyjson.com
          TOOLSHOP_UI_BASE_URL: http://localhost:4200
          TOOLSHOP_API_BASE_URL: http://localhost:8091
          TOOLSHOP_ADMIN_EMAIL: ${{ secrets.TOOLSHOP_ADMIN_EMAIL }}
          TOOLSHOP_ADMIN_PASSWORD: ${{ secrets.TOOLSHOP_ADMIN_PASSWORD }}
          PIPELINE: pr
          TEST_SCOPE: smoke

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-html-report
          path: config/reports/html/
          if-no-files-found: warn

      - name: Show Toolshop logs on failure
        if: failure()
        working-directory: toolshop-app
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: docker compose -f docker-compose.prod.yml logs --tail=150

      - name: Stop Toolshop containers
        if: always()
        working-directory: toolshop-app
        env:
          SPRINT: sprint5
          DISABLE_LOGGING: "true"
        run: docker compose -f docker-compose.prod.yml down -v
